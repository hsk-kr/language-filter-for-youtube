<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Language Filter</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Language Filter</h1>

  <label class="row switch">
    <input type="checkbox" id="enabled">
    <span>Filtering enabled</span>
  </label>

  <fieldset>
    <legend>When a video matches</legend>
    <label class="row"><input type="radio" name="mode" value="not-interested">
      <span>Click “Not interested” (trains your feed)</span></label>
    <label class="row"><input type="radio" name="mode" value="hide">
      <span>Just hide it</span></label>
  </fieldset>

  <fieldset>
    <legend>Languages to filter out</legend>
    <div id="languages" class="grid"></div>
  </fieldset>

  <label class="row">
    <input type="checkbox" id="check-channel">
    <span>Also match channel names (catches English-titled videos from
    e.g. Korean channels)</span>
  </label>

  <p id="ai-status" class="hint"></p>
  <p class="hint">Runs on the YouTube Home feed. Changes apply immediately.</p>

  <script type="module" src="./main.ts"></script>
</body>
</html>
